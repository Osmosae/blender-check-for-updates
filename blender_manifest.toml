schema_version = "1.0.0"

id = "release_watcher"
version = "1.0.0"
name = "Release Watcher"
tagline = "Check for new Blender releases"
maintainer = "Osmosae"
type = "add-on"
website = "https://github.com/Osmosae/blender-check-for-updates"

blender_version_min = "4.2.1"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Check official Blender servers for new releases"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".git/",
  ".gitignore",
  ".pytest_cache/",
  ".blender-test/",
  ".github/",
  "docs/",
  "tests/",
  "*.zip",
]
